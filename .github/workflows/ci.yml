name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 새 커밋이 오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 로컬 개발 환경과 맞춘다 (README 요구 사항 표).
  XCODE_VERSION: "27.2"
  TEST_DEVICE: "iPhone 18 Pro"  # xcode-27 이미지의 iOS 27 런타임에 있는 기기

jobs:
  test:
    name: generate → test
    runs-on: xcode-27  # Xcode 27.x는 이 라벨에만 있다 (public preview)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 선택
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      # mise.toml에 고정된 Tuist 버전을 설치한다.
      - uses: jdx/mise-action@v2

      - name: Tuist 버전 확인
        run: tuist version

      # 외부 의존성(SPM) 체크아웃을 Package.resolved 기준으로 재사용한다.
      - uses: actions/cache@v4
        with:
          path: Tuist/.build
          key: tuist-deps-${{ runner.os }}-${{ hashFiles('Tuist/Package.resolved') }}
          restore-keys: tuist-deps-${{ runner.os }}-

      - name: 외부 의존성 설치
        run: tuist install

      - name: 프로젝트 생성
        run: tuist generate --no-open

      - name: 암묵적 의존 검사
        run: tuist inspect dependencies --only implicit

      # CI에는 이전 실행 기록이 없으므로 선택적 테스트를 끄고 전부 실행한다.
      - name: 테스트
        run: tuist test --device "$TEST_DEVICE" --no-selective-testing
